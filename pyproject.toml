[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kept"
version = "0.1.0"
description = "A private personal AI that tracks and keeps your promises."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
kept = "kept.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kept"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
