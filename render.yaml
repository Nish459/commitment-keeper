# Render Blueprint: builds the root Dockerfile and serves the public demo on the free plan.
# Secrets are never stored here: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: kept
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: KEPT_DEMO_MODE
        value: "true"
      - key: KEPT_NEBIUS_API_KEY
        sync: false
      - key: KEPT_TAVILY_API_KEY
        sync: false
      - key: KEPT_DEMO_ACCESS_CODE
        sync: false
